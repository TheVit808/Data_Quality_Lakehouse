contract:
  name: payments
  version: 1.0.0
  status: active
  description: Fato de pagamentos omnichannel
  owner:
    technical: data-platform@empresa.example
    business: commerce-analytics@empresa.example
  update:
    frequency: hourly
    expected_arrival: "every hour at minute 15"
    sla_minutes: 15
  governance:
    classification: confidential
    sensitivity: financial
    retention_days: 730
    source_system: ecommerce_platform
  storage:
    bronze_format: parquet
    silver_format: parquet
    gold_format: parquet
    partition_by:
      bronze: [ingest_date]
      silver: [order_date]
      gold: [order_date]

schema:
  primary_key: [payment_id]
  foreign_keys:
    order_id: orders.order_id
  columns:
    - name: payment_id
      type: int64
      nullable: false
      description: Identificador único do pagamento
    - name: order_id
      type: int64
      nullable: false
      references: orders.order_id
      description: Pedido associado ao pagamento
    - name: payment_date
      type: date
      nullable: false
      description: Data de criação do pagamento
    - name: payment_method
      type: int64
      nullable: false
      description: Método de pagamento
    - name: payment_status
      type: string
      nullable: false
      accepted_values: [approved, declined, pending]
      description: Status do pagamento
    - name: amount_paid
      type: decimal(18,2)
      nullable: false
      constraints: ["value > 0"]
      description: Valor pago
    - name: installments
      type: int32
      nullable: false
      description: Número de parcelas

quality:
  critical_rules:
    - schema_matches_contract
    - primary_key_not_null
    - primary_key_unique
    - foreign_keys_exist
    - payment_status_domain
    - amount_paid_positive
  warning_rules:
    - installments_completeness
    - amount_paid_outlier_rate
    - freshness_within_sla

compatibility:
  policy: backward_compatible
  breaking_change_requires: major_version
  additive_nullable_column: minor_version
  documentation_only_change: patch_version
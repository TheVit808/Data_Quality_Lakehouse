contract:
  name: events
  version: 1.0.0
  status: active
  description: Fato de eventos omnichannel
  owner:
    technical: data-platform@empresa.example
    business: commerce-analytics@empresa.example
  update:
    frequency: 15min
    expected_arrival: "every hour at minute 15"
    sla_minutes: 10
  governance:
    classification: internal
    sensitivity: behavioral
    retention_days: 730
    source_system: ecommerce_platform
  storage:
    bronze_format: parquet
    silver_format: parquet
    gold_format: parquet
    partition_by:
      bronze: [ingest_date]
      silver: [order_date]
      gold: [order_date]

schema:
  primary_key: [event_id]
  foreign_keys:
    customer_id: customers.customer_id
    product_id: orders.order_id
  columns:
    - name: event_id
      type: int64
      nullable: false
      description: Identificador único do evento
    - name: order_date
      type: date
      nullable: false
      description: Data de criação do pedido
    - name: customer_id
      type: int64
      nullable: false
      references: customers.customer_id
      description: Cliente responsável pelo pedido
    - name: order_id
      type: int64
      nullable: false
      references: orders.order_id
      description: Pedido associado ao evento
    - name: event_timestamp
      type: timestamp
      nullable: false
      description: Timestamp do evento
    - name: event_type
      type: string
      nullable: false
      constraints: ["value in ('purchase', 'return', 'cancel')"]
      description: Tipo do evento
    - name: device_type
      type: string
      nullable: false
      description: Tipo de dispositivo utilizado
    - name: session_duration_seconds
      type: int32
      nullable: false
      constraints: ["value >= 0", "value <= 3600"]
      description: Duração da sessão em segundos

quality:
  critical_rules:
    - schema_matches_contract
    - primary_key_not_null
    - primary_key_unique
    - foreign_keys_exist
    - event_type_domain
    - session_duration_valid
  warning_rules:
    - channel_completeness
    - order_amount_outlier_rate
    - freshness_within_sla

compatibility:
  policy: backward_compatible
  breaking_change_requires: major_version
  additive_nullable_column: minor_version
  documentation_only_change: patch_version
contract:
  name: orders
  version: 1.0.0
  status: active
  description: Fato de pedidos omnichannel
  owner:
    technical: data-platform@empresa.example
    business: commerce-analytics@empresa.example
  update:
    frequency: hourly
    expected_arrival: "every hour at minute 15"
    sla_minutes: 30
  governance:
    classification: confidential
    sensitivity: personal_indirect
    retention_days: 730
    source_system: ecommerce_platform
  storage:
    bronze_format: parquet
    silver_format: parquet
    gold_format: parquet
    partition_by:
      bronze: [ingest_date]
      silver: [order_date]
      gold: [order_date]

schema:
  primary_key: [order_id]
  foreign_keys:
    customer_id: customers.customer_id
    product_id: products.product_id
  columns:
    - name: order_id
      type: int64
      nullable: false
      description: Identificador único do pedido
    - name: order_date
      type: date
      nullable: false
      description: Data de criação do pedido
    - name: customer_id
      type: int64
      nullable: false
      references: customers.customer_id
      description: Cliente responsável pelo pedido
    - name: product_id
      type: int64
      nullable: false
      references: products.product_id
      description: Produto vendido
    - name: channel
      type: string
      nullable: false
      accepted_values: [app, web, store, marketplace, unknown]
      description: Canal de venda
    - name: quantity
      type: int32
      nullable: false
      constraints: ["value > 0"]
      description: Quantidade de unidades
    - name: unit_price_at_order
      type: decimal(18,2)
      nullable: false
      description: Preço unitário no momento da venda
    - name: discount_rate
      type: decimal(8,6)
      nullable: false
      constraints: ["value >= 0", "value <= 1"]
      description: Desconto entre zero e um
    - name: shipping_amount
      type: decimal(18,2)
      nullable: false
      description: Valor do frete
    - name: order_amount
      type: decimal(18,2)
      nullable: false
      description: Valor líquido do pedido
    - name: order_status
      type: string
      nullable: false
      accepted_values: [completed, cancelled, returned, pending]
      description: Estado do pedido
    - name: delivery_days
      type: int32
      nullable: true
      description: Dias de entrega; nulo quando não concluído

quality:
  critical_rules:
    - schema_matches_contract
    - primary_key_not_null
    - primary_key_unique
    - foreign_keys_exist
    - order_status_domain
    - quantity_positive
  warning_rules:
    - channel_completeness
    - order_amount_outlier_rate
    - freshness_within_sla

compatibility:
  policy: backward_compatible
  breaking_change_requires: major_version
  additive_nullable_column: minor_version
  documentation_only_change: patch_version